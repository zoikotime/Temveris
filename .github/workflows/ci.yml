# TEMPLATE: set repo secrets and replace placeholders before enabling Actions.
name: CI

# PR build check — runs on every PR targeting main or develop so you see a
# green/red status on the PR before merging. Does NOT deploy; the deploy.yml
# / deploy-dev.yml workflows still own that on push to main / develop.
on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt

      # Compile-checks every .py without executing — catches syntax / import-time
      # errors that would otherwise only surface on Cloud Run cold-start.
      - name: Syntax check
        working-directory: backend
        run: python -m compileall -q app database

      # Commercial Activation System test gate (Build Contracts §12: "a contract
      # is not real until it is validated by CI"). Runs the commercial suite on
      # in-memory SQLite — no Postgres/Stripe/SMTP needed. Scoped to the green
      # commercial suites; test_break_governance / test_kairos are excluded here
      # due to known pre-existing order-dependent failures unrelated to commercial.
      - name: Commercial tests
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_entitlements.py
          tests/test_state_machines.py
          tests/test_routing.py
          tests/test_fraud.py
          tests/test_qa_matrix.py
          tests/test_webhook_security.py
          tests/test_migration_commercial_tables.py
          tests/test_idempotency.py
          tests/test_signup_idempotency_e2e.py
          tests/test_activation_status.py
          tests/test_commercial_search.py
          tests/test_subscription_ops.py

      # Operational tenancy + public-signup security gate.
      #
      # Kept as its own step rather than appended above so a red build names the
      # concern directly: these guard the operational tenant model and the public
      # signup surface, not the commercial activation contract.
      #
      # The bug class this exists for is invisible without it. Org-scoped reads are
      # written `Model.organization_id == current_user.organization_id`, and
      # SQLAlchemy compiles a Python None to `IS NULL` — so a tenant with a NULL
      # organization_id produces a query that SUCCEEDS and returns every other
      # org-less tenant's rows. Nothing fails loudly; the tests are the only signal.
      #
      # Also covered: signup atomicity (a failed provision must leave no orphan
      # user, or that email can never register again), the challenge fail-closed
      # matrix, and rate-limit keying behind a proxy (`request.client.host` alone
      # collapses every client into one bucket on Cloud Run).
      #
      # test_timezone_hardening is included because its assertions reach into
      # app/org/provisioning_service.py — it is the gate on timezone validation
      # for both provisioning paths.
      - name: Tenancy and signup-security tests
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_super_admin_provisioning_characterization.py
          tests/test_self_service_tenant_provisioning.py
          tests/test_self_service_journey_e2e.py
          tests/test_null_org_isolation.py
          tests/test_setup_wizard_state.py
          tests/test_commercial_resolution_and_enforcement.py
          tests/test_orphan_tenant_inventory.py
          tests/test_client_ip_and_rate_limit_keying.py
          tests/test_timezone_hardening.py
          tests/test_tenant_isolation.py
          tests/test_settings_tier_isolation.py

      # Migration chain must have exactly one head — a divergence means two
      # migrations share a parent and Alembic cannot linearize them.
      - name: Alembic single-head check
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          heads=$(python -m alembic heads 2>/dev/null | grep -c '(head)')
          echo "alembic heads: $heads"
          test "$heads" -eq 1 || { echo "::error::Expected exactly 1 Alembic head, found $heads"; exit 1; }
