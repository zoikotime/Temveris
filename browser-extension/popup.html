<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Temveris Tracker</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; width: 320px; margin: 0; padding: 16px; color: #111827; }
    h1 { font-size: 14px; font-weight: 700; margin: 0 0 4px; color: #0A84A4; }
    p.sub { font-size: 11px; color: #6b7280; margin: 0 0 14px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #374151; margin: 10px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 6px; outline: none; font-family: monospace; }
    input:focus { border-color: #0A84A4; box-shadow: 0 0 0 3px rgba(10,132,164,.15); }
    button { width: 100%; margin-top: 12px; padding: 9px; font-size: 13px; font-weight: 700; border: none; border-radius: 6px; background: linear-gradient(135deg, #0A84A4, #066783); color: #fff; cursor: pointer; }
    button:hover { filter: brightness(1.08); }
    .status { margin-top: 12px; font-size: 11px; padding: 8px 10px; border-radius: 6px; display: none; }
    .ok   { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; display: block; }
    .err  { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; display: block; }
    .live { margin-top: 14px; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; background: #f9fafb; font-size: 11px; color: #374151; line-height: 1.45; word-break: break-all; }
    .live strong { color: #0A84A4; }
  </style>
</head>
<body>
  <h1>Temveris Tracker</h1>
  <p class="sub">Reports the active tab to your Temveris dashboard.</p>

  <label for="apiBase">API base URL</label>
  <input id="apiBase" placeholder="https://api.temveris.example" />

  <label for="token">Access token (JWT)</label>
  <input id="token" placeholder="paste from web dashboard" />

  <button id="save">Save & connect</button>
  <div id="status" class="status"></div>

  <div id="live" class="live" style="display:none"></div>

  <script src="popup.js"></script>
</body>
</html>
