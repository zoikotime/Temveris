<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon — Temveris brand mark. SVG is the primary icon (crisp at
         every size on modern browsers); the JPG stays as fallback for old
         browsers that don't support image/svg+xml favicons. -->
    <link rel="icon"            type="image/svg+xml"  href="/favicon.svg" />
    <link rel="icon"            type="image/jpeg"     href="/favicon.jpg" sizes="any" />
    <link rel="shortcut icon"                         href="/favicon.jpg" />
    <link rel="apple-touch-icon"                      href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Temveris — Employee Time Tracking, Attendance & Leave Management</title>
    <meta name="description" content="Temveris is an all-in-one workforce management platform — track work hours, attendance, breaks and screenshots in real time, manage leave policies and approvals, and get AI-powered productivity insights for your team." />
    <meta name="keywords" content="Temveris, employee time tracking, attendance software, leave management, workforce management, productivity monitoring, screenshot monitoring, HR dashboard" />
    <meta name="application-name" content="Temveris" />
    <meta name="author" content="Temveris" />
    <meta name="theme-color" content="#11496A" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://app.temveris.example/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp previews) -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://app.temveris.example/" />
    <meta property="og:title"       content="Temveris — Employee Time Tracking, Attendance & Leave Management" />
    <meta property="og:description" content="Track work hours, attendance, breaks and screenshots in real time, manage leave policies and approvals, and unlock AI-powered productivity insights — all in one dashboard." />
    <meta property="og:image"       content="https://app.temveris.example/favicon.jpg" />
    <meta property="og:site_name"   content="Temveris" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:site"        content="@temveris" />
    <meta name="twitter:title"       content="Temveris — Employee Time Tracking, Attendance & Leave Management" />
    <meta name="twitter:description" content="Track hours, attendance, breaks and screenshots in real time, manage leave, and get AI-powered team insights." />
    <meta name="twitter:image"       content="https://app.temveris.example/favicon.jpg" />

    <!-- Display fonts used by the Kairos assistant header. Loaded non-blocking
         (media=print → all onload) so they never delay first paint; the
         assistant is lazy-loaded anyway. <noscript> keeps them working without JS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Space+Grotesk:wght@600;700&display=swap"
      media="print" onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Space+Grotesk:wght@600;700&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
